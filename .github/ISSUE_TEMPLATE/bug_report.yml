name: Bug report
description: Report something that's broken.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please fill in the sections below so we
        can reproduce and fix the bug.

        **Security issues:** do NOT open a public issue. Use the **Security** tab of this
        repository and choose **Report a vulnerability**.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? Include exact error messages if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal reproducible example. Reports without one cannot be actioned.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >
        Project version or commit SHA, plus the relevant runtime and operating system.
      placeholder: |
        project: 0.3.1 (or commit abc1234)
        runtime: node 22.4.0 / python 3.12.3 / rustc 1.86.0
        os: macOS 15.5 (arm64)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Paste verbatim. This is automatically formatted as code.
      render: shell
    validations:
      required: false
