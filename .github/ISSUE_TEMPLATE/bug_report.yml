name: Bug report
description: Report something that's broken.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues:** do not open a public issue. Use the **Security** tab of this
        repository and choose **Report a vulnerability**.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Reports without one cannot be actioned.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      placeholder: project version or commit SHA, runtime version, OS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      render: shell
    validations:
      required: false
